  <rect x="468" y="178" width="132" height="162" rx="12" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="534" y="198" text-anchor="middle" fill="#BE123C" font-size="12.5" font-weight="700">机房 C (城市 B)</text>
  <rect x="492" y="208" width="84" height="30" rx="6" fill="#E11D48"/>
  <text x="534" y="228" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">应用服务</text>
  
    <g>
      <path d="M 507.0,273.0 L 507.0,299.0 A 27.0,8 0 0,0 561.0,299.0 L 561.0,273.0 Z" fill="#64748B" stroke="#475569" stroke-width="1.5"/>
      <ellipse cx="534" cy="273.0" rx="27.0" ry="8" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
      <path d="M 507.0,283.9 A 27.0,6.4 0 0,0 561.0,283.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2"/>
