  <text x="436" y="213" text-anchor="middle" fill="#BE123C" font-size="11" font-weight="800">1000km</text>
  <text x="436" y="242" text-anchor="middle" fill="#BE123C" font-size="11" font-weight="800">~30ms!</text>

  <!-- Long painful cross-city write arrow from Room C App back to Room A Master -->
  <path d="M 492 236 C 460 326, 260 332, 176 300" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-rose)"/>
  <text x="336" y="330" text-anchor="middle" fill="#BE123C" font-size="10.5" font-weight="700">跨城回源写主库</text>
  
    <g>
      <rect x="88.0" y="355.0" width="496" height="26" rx="13.0" fill="#FEE2E2"/>
      <text x="336" y="372.14" text-anchor="middle" fill="#BE123C" font-size="11.5" font-weight="700">致命痛点：机房 C 每次写库跨城往返 30ms，一次下单写 10 次直接卡成 300ms！</text>
    </g>
    

