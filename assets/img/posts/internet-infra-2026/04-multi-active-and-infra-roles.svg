  <text x="246" y="216" text-anchor="middle" fill="#059669" font-size="10.5" font-weight="800">30km</text>
  <text x="246" y="240" text-anchor="middle" fill="#059669" font-size="10.5" font-weight="800">~2ms</text>
  <line x1="178" y1="288" x2="306" y2="288" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-slate)"/>
  <text x="246" y="304" text-anchor="middle" fill="#64748B" font-size="10">同步</text>

