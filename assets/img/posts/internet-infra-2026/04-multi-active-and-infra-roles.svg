  <text x="1080" y="272" text-anchor="middle" fill="#1E293B" font-size="12">应用 + 缓存 + 华北分片主库</text>
  
    <g>
      <rect x="981.0" y="296.0" width="198" height="24" rx="12.0" fill="#D1FAE5"/>
