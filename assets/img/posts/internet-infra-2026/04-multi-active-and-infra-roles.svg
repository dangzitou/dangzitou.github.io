  <text x="74" y="559" fill="#475569" font-size="11.5">核心活：vLLM/SGLang 推理、Megatron 训练、RDMA</text>
  <text x="74" y="579" fill="#BE123C" font-size="11.5" font-weight="600">特点：薪资天花板最高 · 门槛极高 (硬核底层+算法)</text>

