  <line x1="998" y1="208" x2="1068" y2="224" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="902" y1="282" x2="956" y2="282" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 3" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="929" y="273" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="700">双向异步</text>
  <text x="929" y="298" text-anchor="middle" fill="#1D4ED8" font-size="10" font-weight="700">灾备复制</text>

  
