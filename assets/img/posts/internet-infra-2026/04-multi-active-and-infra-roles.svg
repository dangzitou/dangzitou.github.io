  <rect width="1280" height="760" rx="20" fill="#F4F6FA"/>

  <text x="640" y="40" text-anchor="middle" fill="#0F172A" font-size="25" font-weight="800">核心硬核图解：异地多活单元化容灾 + 2026 Infra 六大岗位地图</text>
  <text x="640" y="64" text-anchor="middle" fill="#64748B" font-size="14">为什么大厂挖断光缆、机房停电也能秒级恢复？以及想进 Infra 到底该选哪条赛道、学什么语言？</text>

  <!-- TOP PANEL: Multi-Active Architecture (y=86, h=322) -->
  <rect x="36" y="86" width="1208" height="326" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="36" y="86" width="1208" height="40" rx="16" fill="#EFF6FF"/>
  <rect x="36" y="110" width="1208" height="16" fill="#EFF6FF"/>
  <text x="640" y="112" text-anchor="middle" fill="#1E40AF" font-size="15.5" font-weight="800">一、经典高可用架构演进：为什么跨城写库会卡死，单元化多活如何破局？</text>

  <!-- Left Half: Traditional Active-Active problem (30km 2ms vs 1000km 30ms) -->
  <rect x="56" y="140" width="560" height="254" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="336" y="164" text-anchor="middle" fill="#334155" font-size="14" font-weight="800">痛点演示：普通跨城架构的物理时延魔咒</text>

  <!-- City A: Room A & Room B -->
  <rect x="74" y="178" width="150" height="162" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="149" y="198" text-anchor="middle" fill="#1E40AF" font-size="12.5" font-weight="700">机房 A (城市 A)</text>
  <rect x="106" y="208" width="86" height="30" rx="6" fill="#3B82F6"/>
  <text x="149" y="228" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">应用服务</text>
  
    <g>
      <path d="M 122.0,273.0 L 122.0,299.0 A 27.0,8 0 0,0 176.0,299.0 L 176.0,273.0 Z" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5"/>
      <ellipse cx="149" cy="273.0" rx="27.0" ry="8" fill="#60A5FA" stroke="#1D4ED8" stroke-width="1.5"/>
      <path d="M 122.0,283.9 A 27.0,6.4 0 0,0 176.0,283.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2"/>
    </g>
    
  <text x="149" y="290" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="800">主库</text>
  <line x1="149" y1="238" x2="149" y2="262" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="168" y="254" fill="#1E40AF" font-size="10.5" font-weight="700">写/读</text>

  <rect x="268" y="178" width="136" height="162" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="336" y="198" text-anchor="middle" fill="#1E40AF" font-size="12.5" font-weight="700">机房 B (城市 A)</text>
  <rect x="294" y="208" width="84" height="30" rx="6" fill="#3B82F6"/>
  <text x="336" y="228" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">应用服务</text>
  
    <g>
      <path d="M 309.0,273.0 L 309.0,299.0 A 27.0,8 0 0,0 363.0,299.0 L 363.0,273.0 Z" fill="#64748B" stroke="#475569" stroke-width="1.5"/>
      <ellipse cx="336" cy="273.0" rx="27.0" ry="8" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
      <path d="M 309.0,283.9 A 27.0,6.4 0 0,0 363.0,283.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2"/>
    </g>
    
  <text x="336" y="290" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="800">从库</text>
