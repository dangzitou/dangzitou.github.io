  <text x="74" y="660" fill="#1E293B" font-size="12" font-weight="700">主力语言：Java / C++ / Rust / Python</text>
  <text x="74" y="681" fill="#475569" font-size="11.5">核心活：Flink/Spark 内核、Iceberg/Lance、Ray Data</text>
  <text x="74" y="701" fill="#C2410C" font-size="11.5" font-weight="600">特点：大数据开发转型首选 · 多模态数据需求暴涨</text>

